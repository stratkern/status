# Misst alle 15 Minuten (Zeitplan neu registriert 30.09.2026) von GitHub-Infrastruktur aus (nicht unser Server) und legt das Ergebnis ins Repo.
# GitHub Pages liefert index.html und daten/ als status.stratkern.com aus. GitHub startet geplante Läufe nach
# eigener Auslastung, Verzögerungen von einigen Minuten sind normal; die Seite nennt die Zeit der letzten Messung.
name: Messen
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: messen
  cancel-in-progress: false
jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Messen
        env:
          KUNDEN_ZIELE: ${{ secrets.KUNDEN_ZIELE }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
        run: node pruefen.mjs
      - name: Ablegen
        run: |
          git config user.name "status-messung"
          git config user.email "status-messung@users.noreply.github.com"
          git add daten
          git commit -q -m "Messung $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q
